<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Tarang</title>
<style>
:root{
  --bg:#0B0B10; --bg2:#14141C; --card:#1B1B26; --line:#262635;
  --tx:#F4F4F8; --mut:#9A9AB0; --ac:#7C5CFF; --ac2:#FF4FA3;
  --grad:linear-gradient(135deg,#7C5CFF,#FF4FA3);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;height:100%;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
main{flex:1;overflow-y:auto;padding:18px 16px 150px}
.view{display:none}.view.on{display:block;animation:fade .25s}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
h1{font-size:26px;font-weight:800;letter-spacing:-.5px;margin-bottom:14px}
h2{font-size:18px;font-weight:700;margin:22px 0 10px}
.sub{color:var(--mut);font-size:13px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar,.row::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:20px;background:var(--card);font-size:13px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--grad)}
.row{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none}
.card{flex:none;width:140px}
.card .art{width:140px;height:140px;border-radius:12px}
.card .t{font-size:13px;font-weight:600;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .a{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.art{background:var(--card) center/cover no-repeat;position:relative;overflow:hidden;flex:none}
.art.ph{background-image:var(--grad);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;color:#fff}
.list .it{display:flex;align-items:center;gap:12px;padding:8px 0}
.list .it .art{width:52px;height:52px;border-radius:8px}
.list .it .meta{flex:1;min-width:0}
.list .it .t{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list .it .a{font-size:12.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.list .it.now .t{color:#B8A6FF}
.ib{width:38px;height:38px;display:flex;align-items:center;justify-content:center;border-radius:50%;flex:none}
.ib svg{width:22px;height:22px;fill:currentColor}
.ib.liked{color:var(--ac2)}
.search{display:flex;align-items:center;gap:10px;background:#fff;color:#111;border-radius:10px;padding:12px 14px}
.search input{flex:1;border:0;outline:0;background:none;color:#111;font-size:15px}
.search svg{width:20px;height:20px;fill:#555}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{border-radius:12px;padding:14px;height:84px;font-weight:700;font-size:15px;position:relative;overflow:hidden;text-align:left}
.lib{display:flex;align-items:center;gap:14px;padding:10px 0}
.lib .art{width:60px;height:60px;border-radius:10px}
.btn{background:var(--grad);padding:11px 18px;border-radius:24px;font-weight:700;font-size:14px}
.btn.sec{background:var(--card)}
.empty{color:var(--mut);text-align:center;padding:40px 10px;font-size:14px;line-height:1.5}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--ac);border-radius:50%;animation:sp 1s linear infinite;margin:30px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.live{font-size:10px;font-weight:800;background:#E53935;color:#fff;padding:2px 6px;border-radius:4px;margin-right:6px;vertical-align:1px}
.hq{font-size:10px;font-weight:800;border:1px solid var(--mut);color:var(--mut);padding:1px 5px;border-radius:4px;margin-right:6px;vertical-align:1px}

/* bottom nav */
nav{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(to top,var(--bg) 70%,rgba(11,11,16,.0));display:flex;padding:8px 0 10px;z-index:5}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--mut);font-weight:600}
nav button svg{width:24px;height:24px;fill:currentColor}
nav button.on{color:var(--tx)}

/* mini player */
#mini{position:fixed;left:8px;right:8px;bottom:64px;background:#2A2240;border-radius:10px;display:none;align-items:center;gap:10px;padding:7px 8px;z-index:6;overflow:hidden}
#mini.on{display:flex}
#mini .art{width:42px;height:42px;border-radius:6px}
#mini .meta{flex:1;min-width:0}
#mini .t{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mini .a{font-size:12px;color:#C9C2E0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mini .bar{position:absolute;left:8px;right:8px;bottom:0;height:2px;background:rgba(255,255,255,.15)}
#mini .bar i{display:block;height:100%;width:0;background:#fff}

/* full player */
#full{position:fixed;inset:0;z-index:10;transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;padding:16px 22px 28px;background:#1a1530}
#full.on{transform:none}
#full .bgblur{position:absolute;inset:0;background:center/cover;filter:blur(60px) brightness(.45) saturate(1.3);transform:scale(1.4);z-index:-1}
#full .top{display:flex;align-items:center;justify-content:space-between}
#full .top .sub{text-transform:uppercase;letter-spacing:1px;font-size:11px;font-weight:700}
#full .big{width:100%;aspect-ratio:1;border-radius:14px;margin:26px 0 22px;box-shadow:0 20px 50px rgba(0,0,0,.5)}
#full .big.ph{font-size:64px}
#full .info{display:flex;align-items:center;gap:10px}
#full .info .meta{flex:1;min-width:0}
#full .info .t{font-size:22px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#full .info .a{font-size:15px;color:#C9C2E0;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#seek{width:100%;margin-top:20px;-webkit-appearance:none;appearance:none;height:4px;border-radius:2px;background:rgba(255,255,255,.2);outline:0}
#seek::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#fff}
.times{display:flex;justify-content:space-between;font-size:12px;color:#C9C2E0;margin-top:6px}
.ctrls{display:flex;align-items:center;justify-content:space-between;margin-top:16px}
.ctrls .ib svg{width:30px;height:30px}
.ctrls .sm svg{width:22px;height:22px}
.ctrls .sm{color:#C9C2E0}
.ctrls .sm.on{color:#B8A6FF}
.play{width:68px;height:68px;border-radius:50%;background:#fff;color:#111;display:flex;align-items:center;justify-content:center}
.play svg{width:34px;height:34px;fill:#111}
.spacer{flex:1}

/* queue sheet */
#queue{position:fixed;inset:0;z-index:12;background:var(--bg);transform:translateY(100%);transition:transform .3s;display:flex;flex-direction:column}
#queue.on{transform:none}
#queue header{display:flex;align-items:center;gap:10px;padding:16px}
#queue .list{flex:1;overflow-y:auto;padding:0 16px 30px}

#toast{position:fixed;left:50%;bottom:130px;transform:translateX(-50%);background:#fff;color:#111;padding:10px 16px;border-radius:20px;font-size:13px;font-weight:600;opacity:0;transition:opacity .25s;z-index:20;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1}
</style>
</head>
<body>
<div id="app">
<main id="main">

  <!-- HOME -->
  <section class="view on" id="v-home">
    <h1 id="greet">Good evening</h1>
    <div class="chips" id="genres"></div>
    <h2>Trending this week</h2>
    <div class="row" id="trendRow"><div class="spin"></div></div>
    <h2 id="genreTitle">Top tracks</h2>
    <div class="list" id="genreList"></div>
  </section>

  <!-- SEARCH -->
  <section class="view" id="v-search">
    <h1>Search</h1>
    <form class="search" id="sform">
      <svg viewBox="0 0 24 24"><path d="M10 2a8 8 0 0 1 6.32 12.9l5.39 5.4-1.41 1.4-5.4-5.39A8 8 0 1 1 10 2zm0 2a6 6 0 1 0 0 12 6 6 0 0 0 0-12z"/></svg>
      <input id="q" type="search" placeholder="Songs, artists, radio stations" autocomplete="off">
    </form>
    <div id="sres">
      <h2>Browse</h2>
      <div class="grid" id="browse"></div>
    </div>
  </section>

  <!-- RADIO -->
  <section class="view" id="v-radio">
    <h1>Radio</h1>
    <div class="chips" id="langs"></div>
    <div class="list" id="radioList" style="margin-top:10px"></div>
  </section>

  <!-- LIBRARY -->
  <section class="view" id="v-lib">
    <h1>Your Library</h1>
    <button class="lib" style="width:100%;text-align:left" onclick="openLib('liked')">
      <div class="art ph" style="background-image:var(--grad)">♥</div>
      <div><div style="font-weight:700">Liked Songs</div><div class="sub" id="likedCount">0 songs</div></div>
    </button>
    <button class="lib" style="width:100%;text-align:left" onclick="openLib('local')">
      <div class="art ph" style="background-image:linear-gradient(135deg,#1DB97A,#0E7C66)">♫</div>
      <div><div style="font-weight:700">On this phone</div><div class="sub" id="localCount">Add your own music files (FLAC, MP3…)</div></div>
    </button>
    <button class="lib" style="width:100%;text-align:left" onclick="openLib('stations')">
      <div class="art ph" style="background-image:linear-gradient(135deg,#FF8A3D,#E53935)">📻</div>
      <div><div style="font-weight:700">Saved Stations</div><div class="sub" id="stCount">0 stations</div></div>
    </button>
    <button class="lib" style="width:100%;text-align:left" onclick="openLib('recent')">
      <div class="art ph" style="background-image:linear-gradient(135deg,#3D8BFF,#2B4FE0)">⟲</div>
      <div><div style="font-weight:700">Recently Played</div><div class="sub">Your last 50 plays</div></div>
    </button>
    <div id="libDetail"></div>
  </section>
</main>

<!-- MINI PLAYER -->
<div id="mini">
  <div class="art" id="mArt"></div>
  <div class="meta" onclick="openFull()"><div class="t" id="mT"></div><div class="a" id="mA"></div></div>
  <button class="ib" id="mLike" onclick="likeCurrent()"></button>
  <button class="ib" id="mPlay" onclick="Native.toggle()"></button>
  <div class="bar"><i id="mBar"></i></div>
</div>

<!-- NAV -->
<nav id="nav">
  <button data-v="home" class="on"><svg viewBox="0 0 24 24"><path d="M12 3l9 8h-3v9h-5v-6h-2v6H6v-9H3z"/></svg>Home</button>
  <button data-v="search"><svg viewBox="0 0 24 24"><path d="M10 2a8 8 0 0 1 6.32 12.9l5.39 5.4-1.41 1.4-5.4-5.39A8 8 0 1 1 10 2zm0 2a6 6 0 1 0 0 12 6 6 0 0 0 0-12z"/></svg>Search</button>
  <button data-v="radio"><svg viewBox="0 0 24 24"><path d="M20 6H8.3l8.26-3.34L15.88 1 3.24 6.15C2.51 6.43 2 7.17 2 8v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2zM7 20a3 3 0 1 1 0-6 3 3 0 0 1 0 6zm13-8h-2v-2h-2v2H4V8h16z"/></svg>Radio</button>
  <button data-v="lib"><svg viewBox="0 0 24 24"><path d="M4 4h2v16H4zm4 0h2v16H8zm4.5 1.1l1.9-.6 5.3 15.3-1.9.6z"/></svg>Library</button>
</nav>
</div>

<!-- FULL PLAYER -->
<div id="full">
  <div class="bgblur" id="fBg"></div>
  <div class="top">
    <button class="ib" onclick="closeFull()"><svg viewBox="0 0 24 24"><path d="M7.4 8.6L12 13.2l4.6-4.6L18 10l-6 6-6-6z"/></svg></button>
    <div class="sub" id="fSrc">Now playing</div>
    <button class="ib" onclick="openQueue()"><svg viewBox="0 0 24 24"><path d="M3 6h13v2H3zm0 5h13v2H3zm0 5h9v2H3zm15-2V6h4v2h-2v8a3 3 0 1 1-2-2.83z"/></svg></button>
  </div>
  <div class="art big" id="fArt"></div>
  <div class="info">
    <div class="meta"><div class="t" id="fT"></div><div class="a" id="fA"></div></div>
    <button class="ib" id="fLike" onclick="likeCurrent()"></button>
  </div>
  <input type="range" id="seek" min="0" max="1000" value="0">
  <div class="times"><span id="tCur">0:00</span><span id="tDur">0:00</span></div>
  <div class="ctrls">
    <button class="ib sm" id="bShuf" onclick="toggleShuffle()"><svg viewBox="0 0 24 24"><path d="M10.6 9.2L5.4 4 4 5.4l5.2 5.2zM14.5 4l2 2L4 18.6 5.4 20 18 7.5l2 2V4zm.3 9.4l-1.4 1.4 3.1 3.1-2 2H20v-5.5l-2 2z"/></svg></button>
    <button class="ib" onclick="Native.prev()"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg></button>
    <button class="play" id="fPlay" onclick="Native.toggle()"></button>
    <button class="ib" onclick="Native.next()"><svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6zm10-12v12h2V6z"/></svg></button>
    <button class="ib sm" id="bRep" onclick="cycleRepeat()"><svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2z"/></svg></button>
  </div>
  <div class="spacer"></div>
  <div class="sub" id="fQual" style="text-align:center"></div>
</div>

<!-- QUEUE -->
<div id="queue">
  <header>
    <button class="ib" onclick="closeQueue()"><svg viewBox="0 0 24 24"><path d="M7.4 8.6L12 13.2l4.6-4.6L18 10l-6 6-6-6z"/></svg></button>
    <div style="font-weight:700;font-size:17px">Up next</div>
  </header>
  <div class="list" id="qList"></div>
</div>

<div id="toast"></div>

<script>
/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const AUD = "https://api.audius.co/v1";
const APP = "app_name=Tarang";
const RB_HOSTS = ["de1","fi1","at1","nl1"];
const IC = {
  play:'<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>',
  pause:'<svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>',
  heart:'<svg viewBox="0 0 24 24"><path d="M12 21l-1.45-1.32C5.4 15 2 11.9 2 8.1 2 5 4.4 2.6 7.5 2.6c1.74 0 3.41.81 4.5 2.09A6 6 0 0 1 16.5 2.6C19.6 2.6 22 5 22 8.1c0 3.8-3.4 6.9-8.55 11.6z"/></svg>',
  heartO:'<svg viewBox="0 0 24 24"><path d="M16.5 2.6c-1.74 0-3.41.81-4.5 2.09A6 6 0 0 0 7.5 2.6C4.4 2.6 2 5 2 8.1c0 3.8 3.4 6.9 8.55 11.6L12 21l1.45-1.32C18.6 15 22 11.9 22 8.1 22 5 19.6 2.6 16.5 2.6zm-4.4 15.6l-.1.1-.1-.1C7.14 13.9 4 11 4 8.1 4 6.1 5.5 4.6 7.5 4.6c1.54 0 3.04 1 3.57 2.36h1.87C13.46 5.6 14.96 4.6 16.5 4.6c2 0 3.5 1.5 3.5 3.5 0 2.9-3.14 5.8-7.9 10.1z"/></svg>',
  more:'<svg viewBox="0 0 24 24"><path d="M12 8a2 2 0 1 0 0-4 2 2 0 0 0 0 4zm0 2a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm0 6a2 2 0 1 0 0 4 2 2 0 0 0 0-4z"/></svg>'
};
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = ms => { ms = Math.max(0, ms|0); const s = Math.floor(ms/1000); return Math.floor(s/60) + ":" + String(s%60).padStart(2,"0"); };
function load(k, d){ try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch(e){ return d; } }
function save(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
let toastT;
function toast(msg){ const t=$("toast"); t.textContent=msg; t.classList.add("on"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("on"),2000); }
const hasNative = typeof window.Native !== "undefined";
if (!hasNative) window.Native = {playQueue(){toast("Player only works in the app")},toggle(){},next(){},prev(){},seek(){},jumpTo(){},setShuffle(){},setRepeat(){},pickFiles(){}};

async function getJSON(url, timeout=12000){
  const ctl = new AbortController(); const tm = setTimeout(()=>ctl.abort(), timeout);
  try { const r = await fetch(url, {signal:ctl.signal}); if(!r.ok) throw new Error(r.status); return await r.json(); }
  finally { clearTimeout(tm); }
}
async function rb(path){
  let last;
  for (const h of RB_HOSTS){
    try { return await getJSON(`https://${h}.api.radio-browser.info/json/${path}`); } catch(e){ last=e; }
  }
  throw last;
}

/* ---------- data model ---------- */
// track: {id,title,artist,art,url,src:'audius'|'radio'|'local',dur}
function fromAudius(t){
  const art = t.artwork ? (t.artwork["480x480"] || t.artwork["1000x1000"] || t.artwork["150x150"] || "") : "";
  return { id:"au:"+t.id, title:t.title, artist:t.user ? t.user.name : "", art,
    url:`${AUD}/tracks/${t.id}/stream?${APP}`, src:"audius", dur:(t.duration||0)*1000 };
}
function fromStation(s){
  return { id:"rb:"+s.stationuuid, title:s.name.trim(), artist:[s.country, s.codec && s.bitrate ? s.codec+" "+s.bitrate+"k" : s.codec].filter(Boolean).join(" · "),
    art:(s.favicon||"").trim(), url:s.url_resolved || s.url, src:"radio", dur:0, bitrate:s.bitrate||0, codec:s.codec||"" };
}

let liked   = load("liked", []);
let local   = load("local", []);
let stations= load("stations", []);
let recent  = load("recent", []);
let queue = [];
let state = {playing:false,pos:0,dur:0,index:0,id:"",title:"",artist:"",art:"",shuffle:false,repeat:0};
let lists = {};      // id -> array of tracks rendered, for tap-to-play
let listSeq = 0;

/* ---------- rendering ---------- */
function artHTML(t, cls){
  if (t.art) return `<div class="art ${cls||""}" style="background-image:url('${esc(t.art)}')"></div>`;
  const letter = esc((t.title||"?").trim().charAt(0).toUpperCase());
  return `<div class="art ph ${cls||""}">${letter}</div>`;
}
function isLiked(id){ return liked.some(x=>x.id===id) || stations.some(x=>x.id===id); }
function badge(t){ return t.src==="radio" ? '<span class="live">LIVE</span>' : (t.src==="local" ? '<span class="hq">FILE</span>' : ""); }

function renderList(el, tracks, opts={}){
  if (!tracks.length){ el.innerHTML = `<div class="empty">${opts.empty || "Nothing here yet."}</div>`; return; }
  const key = "L" + (++listSeq); lists[key] = tracks;
  el.innerHTML = tracks.map((t,i)=>`
    <div class="it ${t.id===state.id?"now":""}" data-id="${esc(t.id)}">
      <div style="display:contents" onclick="playFrom('${key}',${i})">
        ${artHTML(t)}
        <div class="meta"><div class="t">${esc(t.title)}</div><div class="a">${badge(t)}${esc(t.artist)}${t.dur?" · "+fmt(t.dur):""}</div></div>
      </div>
      <button class="ib ${isLiked(t.id)?"liked":""}" onclick="toggleLike('${key}',${i},this)">${isLiked(t.id)?IC.heart:IC.heartO}</button>
      ${opts.removable ? `<button class="ib" onclick="removeItem('${opts.removable}','${esc(t.id)}')">✕</button>` : ""}
    </div>`).join("");
}
function renderRow(el, tracks){
  if (!tracks.length){ el.innerHTML = `<div class="empty">Couldn't load. Check your internet.</div>`; return; }
  const key = "L" + (++listSeq); lists[key] = tracks;
  el.innerHTML = tracks.map((t,i)=>`
    <div class="card" onclick="playFrom('${key}',${i})">${artHTML(t)}<div class="t">${esc(t.title)}</div><div class="a">${esc(t.artist)}</div></div>`).join("");
}
function markNow(){
  document.querySelectorAll(".list .it").forEach(e => e.classList.toggle("now", e.dataset.id === state.id));
}

/* ---------- playback ---------- */
function playFrom(key, i){
  const arr = lists[key]; if (!arr) return;
  playTracks(arr, i);
}
function playTracks(arr, i){
  queue = arr.slice(0, 200);
  Native.playQueue(JSON.stringify(queue.map(t=>({id:t.id,title:t.title,artist:t.artist,art:t.art,url:t.url}))), i);
  const t = queue[i];
  state.id = t.id; state.title=t.title; state.artist=t.artist; state.art=t.art;
  addRecent(t); updatePlayerUI(); markNow();
}
function addRecent(t){
  recent = [t, ...recent.filter(x=>x.id!==t.id)].slice(0,50); save("recent", recent);
}
function currentTrack(){
  return queue.find(t=>t.id===state.id) || recent.find(t=>t.id===state.id) ||
    (state.id ? {id:state.id,title:state.title,artist:state.artist,art:state.art,src:state.id.startsWith("rb:")?"radio":(state.id.startsWith("au:")?"audius":"local")} : null);
}

let lastId = "";
window.onNativeState = function(s){
  const changed = s.id !== state.id;
  Object.assign(state, s);
  if (changed && s.id){ const t = queue.find(x=>x.id===s.id); if (t) addRecent(t); }
  updatePlayerUI(changed || s.id !== lastId);
  lastId = s.id;
  if (changed) markNow();
};

let seeking = false;
function updatePlayerUI(full=true){
  const t = currentTrack();
  $("mini").classList.toggle("on", !!t);
  if (!t) return;
  const live = t.src === "radio";
  const playIc = state.playing ? IC.pause : IC.play;
  $("mPlay").innerHTML = playIc; $("fPlay").innerHTML = playIc;
  const pct = state.dur ? state.pos/state.dur : 0;
  $("mBar").style.width = (live ? 0 : pct*100) + "%";
  if (!seeking){ $("seek").value = Math.round(pct*1000); }
  $("seek").disabled = live || !state.dur;
  $("tCur").textContent = live ? "LIVE" : fmt(state.pos);
  $("tDur").textContent = live ? "" : fmt(state.dur);
  $("bShuf").classList.toggle("on", !!state.shuffle);
  $("bRep").classList.toggle("on", state.repeat > 0);
  $("bRep").style.opacity = 1;
  $("bRep").title = ["Repeat off","Repeat one","Repeat all"][state.repeat]||"";
  if (!full) return;
  const title = t.title || state.title, artist = t.artist || state.artist, art = t.art || state.art;
  $("mT").textContent = title; $("mA").textContent = (state.buffering ? "Loading… " : "") + artist;
  $("fT").textContent = title; $("fA").textContent = artist;
  const setArt = (el) => {
    if (art){ el.className = el.className.replace(/\bph\b/,""); el.style.backgroundImage = `url('${art}')`; el.textContent=""; }
    else { el.classList.add("ph"); el.style.backgroundImage = "var(--grad)"; el.textContent = (title||"?").charAt(0).toUpperCase(); }
  };
  setArt($("mArt")); setArt($("fArt"));
  $("fBg").style.backgroundImage = art ? `url('${art}')` : "none";
  const lk = isLiked(t.id);
  $("mLike").innerHTML = lk?IC.heart:IC.heartO; $("mLike").classList.toggle("liked", lk);
  $("fLike").innerHTML = lk?IC.heart:IC.heartO; $("fLike").classList.toggle("liked", lk);
  $("fSrc").textContent = live ? "Live radio" : (t.src==="local" ? "From your phone" : "Now playing");
  $("fQual").textContent = live ? (t.codec ? `${t.codec} ${t.bitrate?t.bitrate+" kbps":""}` : "") :
    (t.src==="local" ? "Original file quality" : "Streaming in best available quality");
}
const seek = $("seek");
seek.addEventListener("input", ()=>{ seeking = true; $("tCur").textContent = fmt(seek.value/1000*state.dur); });
seek.addEventListener("change", ()=>{ Native.seek(seek.value/1000*state.dur); setTimeout(()=>seeking=false, 600); });

function toggleShuffle(){ Native.setShuffle(!state.shuffle); state.shuffle=!state.shuffle; updatePlayerUI(false); toast(state.shuffle?"Shuffle on":"Shuffle off"); }
function cycleRepeat(){ // 0 off -> 2 all -> 1 one -> 0
  const nxt = state.repeat===0 ? 2 : (state.repeat===2 ? 1 : 0);
  Native.setRepeat(nxt); state.repeat=nxt; updatePlayerUI(false);
  toast(["Repeat off","Repeat one","Repeat all"][nxt]);
}

/* ---------- likes ---------- */
function setLike(t, on){
  if (t.src === "radio"){
    stations = on ? [t, ...stations.filter(x=>x.id!==t.id)] : stations.filter(x=>x.id!==t.id); save("stations", stations);
  } else {
    liked = on ? [t, ...liked.filter(x=>x.id!==t.id)] : liked.filter(x=>x.id!==t.id); save("liked", liked);
  }
  toast(on ? (t.src==="radio"?"Station saved":"Added to Liked Songs") : "Removed");
  updateLibCounts(); updatePlayerUI();
}
function toggleLike(key, i, btn){
  const t = lists[key][i]; const on = !isLiked(t.id); setLike(t, on);
  btn.classList.toggle("liked", on); btn.innerHTML = on?IC.heart:IC.heartO;
}
function likeCurrent(){ const t = currentTrack(); if (t) setLike(t, !isLiked(t.id)); }

/* ---------- full player / queue ---------- */
function openFull(){ $("full").classList.add("on"); }
function closeFull(){ $("full").classList.remove("on"); }
function openQueue(){
  const el = $("qList");
  if (!queue.length){ el.innerHTML = '<div class="empty">Queue is empty.</div>'; }
  else {
    el.innerHTML = queue.map((t,i)=>`<div class="it ${t.id===state.id?"now":""}" onclick="Native.jumpTo(${i})">${artHTML(t)}<div class="meta"><div class="t">${esc(t.title)}</div><div class="a">${esc(t.artist)}</div></div></div>`).join("");
  }
  $("queue").classList.add("on");
}
function closeQueue(){ $("queue").classList.remove("on"); }
window.onBack = function(){
  if ($("queue").classList.contains("on")){ closeQueue(); return true; }
  if ($("full").classList.contains("on")){ closeFull(); return true; }
  if ($("libDetail").innerHTML){ $("libDetail").innerHTML=""; return true; }
  if (curView !== "home"){ show("home"); return true; }
  return false;
};
// swipe down to close full player
(function(){ let y0=null; const f=$("full");
  f.addEventListener("touchstart", e=>{ if(e.target.id!=="seek") y0=e.touches[0].clientY; }, {passive:true});
  f.addEventListener("touchend", e=>{ if(y0!==null && e.changedTouches[0].clientY-y0>120) closeFull(); y0=null; });
})();

/* ---------- navigation ---------- */
let curView = "home";
function show(v){
  curView = v;
  document.querySelectorAll(".view").forEach(e=>e.classList.toggle("on", e.id==="v-"+v));
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on", b.dataset.v===v));
  $("main").scrollTop = 0;
  if (v==="radio" && !$("radioList").innerHTML) loadRadio(curLang);
  if (v==="lib") updateLibCounts();
}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>show(b.dataset.v));

/* ---------- home ---------- */
const GENRES = ["All","Electronic","Hip-Hop/Rap","Pop","R&B/Soul","Lo-Fi","Ambient","Rock","Alternative","Acoustic","Jazz","Classical","World","Devotional","Soundtrack","Reggae","Latin","Dancehall","Afrobeats"];
let curGenre = "All";
function greet(){ const h=new Date().getHours(); $("greet").textContent = h<5?"Good night":h<12?"Good morning":h<17?"Good afternoon":"Good evening"; }
function renderGenres(){
  $("genres").innerHTML = GENRES.map(g=>`<button class="chip ${g===curGenre?"on":""}" onclick="pickGenre('${g}')">${esc(g)}</button>`).join("");
}
function pickGenre(g){ curGenre=g; renderGenres(); loadGenre(); }
async function loadTrending(){
  try {
    const j = await getJSON(`${AUD}/tracks/trending?time=week&limit=20&${APP}`);
    renderRow($("trendRow"), (j.data||[]).map(fromAudius));
  } catch(e){ $("trendRow").innerHTML = `<div class="empty">Couldn't reach the music server. <br><button class="btn sec" style="margin-top:10px" onclick="loadTrending()">Try again</button></div>`; }
}
async function loadGenre(){
  $("genreTitle").textContent = curGenre==="All" ? "Top tracks this month" : `Top ${curGenre}`;
  $("genreList").innerHTML = '<div class="spin"></div>';
  try {
    const g = curGenre==="All" ? "" : `&genre=${encodeURIComponent(curGenre)}`;
    const j = await getJSON(`${AUD}/tracks/trending?time=month&limit=40${g}&${APP}`);
    renderList($("genreList"), (j.data||[]).map(fromAudius), {empty:"No tracks found for this genre."});
  } catch(e){ $("genreList").innerHTML = `<div class="empty">Couldn't load tracks.</div>`; }
}

/* ---------- search ---------- */
const BROWSE = [
  ["Malayalam radio","malayalam","#E8633A"],["Quran","quran","#1E9E6A"],["Lo-Fi","Lo-Fi","#6B4FD8"],
  ["Hindi radio","hindi","#D6336C"],["Arabic radio","arabic","#B8860B"],["Electronic","Electronic","#1E88E5"],
  ["Tamil radio","tamil","#C2185B"],["Ambient","Ambient","#00897B"],["Hip-Hop","Hip-Hop/Rap","#F4511E"],["Classical","Classical","#5E35B1"]
];
$("browse").innerHTML = BROWSE.map(([n,k,c])=>`<button class="tile" style="background:${c}" onclick="browseGo('${k}')">${esc(n)}</button>`).join("");
function browseGo(k){
  if (["malayalam","quran","hindi","arabic","tamil"].includes(k)){ curLang=k; renderLangs(); show("radio"); loadRadio(k); }
  else { curGenre=k; renderGenres(); loadGenre(); show("home"); }
}
let sTimer;
$("q").addEventListener("input", ()=>{ clearTimeout(sTimer); sTimer=setTimeout(doSearch, 450); });
$("sform").addEventListener("submit", e=>{ e.preventDefault(); $("q").blur(); doSearch(); });
let searchSeq = 0;
async function doSearch(){
  const q = $("q").value.trim(); const box = $("sres");
  if (!q){ box.innerHTML = '<h2>Browse</h2><div class="grid" id="browse"></div>'; $("browse").innerHTML = BROWSE.map(([n,k,c])=>`<button class="tile" style="background:${c}" onclick="browseGo('${k}')">${esc(n)}</button>`).join(""); return; }
  const my = ++searchSeq;
  box.innerHTML = '<h2>Songs</h2><div class="list" id="sSongs"><div class="spin"></div></div><h2>Radio stations</h2><div class="list" id="sRadio"><div class="spin"></div></div>';
  getJSON(`${AUD}/tracks/search?query=${encodeURIComponent(q)}&limit=30&${APP}`)
    .then(j=>{ if(my===searchSeq) renderList($("sSongs"), (j.data||[]).map(fromAudius), {empty:"No songs found."}); })
    .catch(()=>{ if(my===searchSeq) $("sSongs").innerHTML='<div class="empty">Song search failed.</div>'; });
  rb(`stations/search?name=${encodeURIComponent(q)}&limit=20&hidebroken=true&order=clickcount&reverse=true`)
    .then(j=>{ if(my===searchSeq) renderList($("sRadio"), j.map(fromStation), {empty:"No stations found."}); })
    .catch(()=>{ if(my===searchSeq) $("sRadio").innerHTML='<div class="empty">Radio search failed.</div>'; });
}

/* ---------- radio ---------- */
const LANGS = [["Malayalam","malayalam"],["Quran","quran"],["Hindi","hindi"],["Tamil","tamil"],["Arabic","arabic"],["English","english"],["Telugu","telugu"],["Kannada","kannada"],["Urdu","urdu"],["India top","IN"],["World top","top"]];
let curLang = "malayalam";
function renderLangs(){ $("langs").innerHTML = LANGS.map(([n,k])=>`<button class="chip ${k===curLang?"on":""}" onclick="curLang='${k}';renderLangs();loadRadio('${k}')">${n}</button>`).join(""); }
async function loadRadio(k){
  const el = $("radioList"); el.innerHTML = '<div class="spin"></div>';
  const common = "hidebroken=true&order=clickcount&reverse=true&limit=80";
  let path;
  if (k==="quran") path = `stations/search?tag=quran&${common}`;
  else if (k==="IN") path = `stations/search?countrycode=IN&${common}`;
  else if (k==="top") path = `stations/topclick/80`;
  else path = `stations/search?language=${k}&${common}`;
  try { const j = await rb(path); renderList(el, j.filter(s=>s.url_resolved||s.url).map(fromStation), {empty:"No stations found."}); }
  catch(e){ el.innerHTML = `<div class="empty">Couldn't load stations.<br><button class="btn sec" style="margin-top:10px" onclick="loadRadio(curLang)">Try again</button></div>`; }
}

/* ---------- library ---------- */
function updateLibCounts(){
  $("likedCount").textContent = liked.length + (liked.length===1?" song":" songs");
  $("localCount").textContent = local.length ? local.length + " files" : "Add your own music files (FLAC, MP3…)";
  $("stCount").textContent = stations.length + (stations.length===1?" station":" stations");
}
function openLib(which){
  const d = $("libDetail");
  const titles = {liked:"Liked Songs", local:"On this phone", stations:"Saved Stations", recent:"Recently Played"};
  const data = {liked, local, stations, recent}[which];
  let top = `<div style="display:flex;align-items:center;justify-content:space-between;margin-top:18px"><h2 style="margin:0">${titles[which]}</h2><button class="ib" onclick="$('libDetail').innerHTML=''">✕</button></div>`;
  let btns = '<div style="display:flex;gap:10px;margin:12px 0">';
  if (data.length) btns += `<button class="btn" onclick="playLib('${which}',false)">▶ Play</button><button class="btn sec" onclick="playLib('${which}',true)">⤨ Shuffle</button>`;
  if (which==="local") btns += `<button class="btn sec" onclick="Native.pickFiles()">+ Add files</button>`;
  btns += "</div>";
  d.innerHTML = top + btns + '<div class="list" id="libList"></div>';
  const empty = {liked:"Tap ♡ on any song to save it here.", local:"Tap “Add files” to pick songs from your phone. FLAC and WAV play in full lossless quality.", stations:"Tap ♡ on a radio station to save it.", recent:"Songs you play show up here."}[which];
  renderList($("libList"), data, {empty, removable: which==="local" ? "local" : (which==="recent" ? "recent" : "")});
  d.scrollIntoView({behavior:"smooth"});
}
function playLib(which, shuffle){
  let data = {liked, local, stations, recent}[which].slice();
  if (shuffle){ for (let i=data.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [data[i],data[j]]=[data[j],data[i]]; } }
  playTracks(data, 0);
}
function removeItem(which, id){
  if (which==="local"){ local = local.filter(x=>x.id!==id); save("local", local); openLib("local"); }
  if (which==="recent"){ recent = recent.filter(x=>x.id!==id); save("recent", recent); openLib("recent"); }
  updateLibCounts();
}
window.onLocalFiles = function(files){
  const ids = new Set(local.map(x=>x.id));
  const fresh = files.filter(f=>!ids.has(f.id));
  local = [...local, ...fresh]; save("local", local);
  toast(`Added ${fresh.length} file${fresh.length===1?"":"s"}`);
  updateLibCounts(); openLib("local");
};

/* ---------- start ---------- */
greet(); renderGenres(); renderLangs(); updateLibCounts();
loadTrending(); loadGenre();
</script>
</body>
</html>
